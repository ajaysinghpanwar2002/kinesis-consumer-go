version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/pkg/backend/valkey"
      - "/examples/valkey"
      - "/test/integration"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
